plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.6'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'net.edubovit'
version = '0.0.1-SNAPSHOT'
description = 'Small web application for monitoring server resources and top processes'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

springBoot {
    mainClass = 'net.edubovit.topmonitor.TopMonitorApplication'
}

tasks.named('bootJar') {
    archiveFileName = 'top-monitor.jar'
}

tasks.named('jar') {
    enabled = false
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'com.github.oshi:oshi-core:6.6.6'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}
